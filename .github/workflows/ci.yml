name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately not `pip install -r requirements.txt` here.
      # embeddings.py imports sentence-transformers lazily (only inside
      # _get_model()), and the tests mock that function directly, so the
      # test suite never actually needs torch installed. Skipping it
      # keeps CI fast and avoids a large, occasionally slow download.
      - name: Install test dependencies
        run: pip install chromadb anthropic pytest

      - name: Run tests
        run: python -m pytest tests/ -v
